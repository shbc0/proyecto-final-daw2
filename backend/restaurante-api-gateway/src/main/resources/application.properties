spring.application.name=restaurante-api-gateway

server.port=8090
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

app.cors.allowed-origin=http://localhost:4200

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth-service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=carta-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://carta-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/carta-service/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=mesa-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://mesa-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/mesa-service/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=pedido-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://pedido-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/pedido-service/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
